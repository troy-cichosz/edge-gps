services:
  edge-gps:
    #build: .
    image: $(edge-gps_TAG)
    restart: unless-stopped
    container_name: edge-gps
    uts: host
    devices:
      - /dev/serial0:/dev/serial0
    ports:
      - "${GPS_HTTP_PORT:-8096}:8096"
    volumes:
      - ./config:/app/config:ro
      - ../logs/edge-gps:/logs
      - ../metadata:/metadata
    environment:
      - GPS_CONFIG=/app/config/gps.yaml
      - GPS_DEVICE=${GPS_DEVICE:-/dev/serial0}
      - GPS_BAUDRATE=${GPS_BAUDRATE:-9600}
      - GPS_LOG_LEVEL=${GPS_LOG_LEVEL:-INFO}
      - GPS_HTTP_HOST=0.0.0.0
      - GPS_HTTP_PORT=${GPS_HTTP_PORT:-8096}
      - EDGE_CONTROLLER_URL=${EDGE_CONTROLLER_URL}
      - EDGE_CONTROLLER_TIMEOUT=${EDGE_CONTROLLER_TIMEOUT:-5}
      - EDGE_NODE_ID=${EDGE_NODE_ID}
      - EDGE_SERVICE_ID=${EDGE_SERVICE_ID:-edge-gps}
      - EDGE_SERVICE_NAME=${EDGE_SERVICE_NAME:-edge-gps}
      - EDGE_SERVICE_VERSION=${EDGE_SERVICE_VERSION:-0.1.0}
